<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Strategy Planner · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-root=".." data-page="toolkit">
<main>
  <div id="tool-hero" data-tool="teaching-strategy" data-sub="Describe your class and goal. Skillyfai ranks proven strategies that fit, with step-by-step guidance."></div>
  <div id="planner"></div>
  <div id="related" data-tool="teaching-strategy"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/planner.js"></script>
<script>
/* size: s (<20) m (20-40) l (>40); res: 0 minimal, 1 some materials, 2 devices; min = minutes needed */
const STRATS = [
  { n: "Think-Pair-Share", goals: ["Discussion", "Understanding"], size: "sml", res: 0, min: 10, lv: "PMS",
    d: "Students think alone, discuss with a partner, then share with the class. Works in any class size.",
    steps: ["Pose an open question about {t}.", "Give 1 minute of silent thinking time.", "Pairs discuss for 2–3 minutes.", "Invite 4–5 pairs to share; build a class answer on the board."] },
  { n: "Jigsaw", goals: ["Understanding", "Discussion"], size: "ml", res: 1, min: 30, lv: "MS",
    d: "Each group masters one part of the topic and teaches it to others. Builds responsibility.",
    steps: ["Split {t} into 4–5 sub-topics.", "Expert groups study one sub-topic each (10 min).", "Re-form mixed groups with one expert from each.", "Experts teach their part; groups complete a summary sheet."] },
  { n: "Demonstration and explanation", goals: ["Understanding", "Skills"], size: "sml", res: 1, min: 15, lv: "PMS",
    d: "Teacher models the concept or skill step by step while students observe and predict.",
    steps: ["Show the materials and ask students to predict what will happen.", "Demonstrate {t} slowly, naming each step.", "Ask 'why' questions at each step.", "Let 2–3 students repeat the demonstration."] },
  { n: "Storytelling", goals: ["Understanding", "Creativity"], size: "sml", res: 0, min: 10, lv: "PM",
    d: "A short story or real-life situation carries the concept and makes it memorable.",
    steps: ["Tell a short story where a character meets {t}.", "Pause at key moments: 'What should she do?'", "Draw out the key idea from the story.", "Students retell or continue the story."] },
  { n: "Inquiry-based learning", goals: ["Understanding", "Skills", "Creativity"], size: "sm", res: 1, min: 35, lv: "MS",
    d: "Students investigate a question, collect evidence and draw conclusions.",
    steps: ["Pose a puzzling question about {t}.", "Groups make a prediction.", "Groups collect evidence (observe, test, read).", "Share findings and compare with predictions."] },
  { n: "Role play and drama", goals: ["Creativity", "Discussion", "Understanding"], size: "sm", res: 0, min: 25, lv: "PMS",
    d: "Students act out situations, characters or processes to understand them from the inside.",
    steps: ["Describe a scene connected to {t}.", "Assign roles to small groups (5 min to prepare).", "Groups perform in 2 minutes each.", "Discuss: what did the characters feel or learn?"] },
  { n: "Learning games", goals: ["Practice", "Revision"], size: "sml", res: 0, min: 15, lv: "PM",
    d: "Quiz contests, bingo or relay races turn practice into play.",
    steps: ["Prepare 10–15 quick questions on {t}.", "Divide the class into teams.", "Play a relay or quiz round with points.", "Review any questions most teams missed."] },
  { n: "Concept mapping", goals: ["Understanding", "Revision"], size: "sml", res: 0, min: 15, lv: "MS",
    d: "Students connect key ideas visually to show how they relate.",
    steps: ["Write {t} in the centre of the board.", "Students suggest connected words.", "Draw links and label each connection.", "Students make their own map in notebooks."] },
  { n: "Peer tutoring", goals: ["Practice", "Revision"], size: "ml", res: 0, min: 15, lv: "PMS",
    d: "Stronger students support classmates. Helpful in large, mixed-level classes.",
    steps: ["Identify confident students for {t}.", "Pair them with students who need support.", "Give a short practice sheet.", "Check pairs and rotate roles next time."] },
  { n: "Station rotation", goals: ["Practice", "Skills"], size: "sm", res: 1, min: 35, lv: "PM",
    d: "Groups rotate through 3–4 stations, each with a different activity on the same topic.",
    steps: ["Set up 3–4 stations on {t} (read, do, write, play).", "Explain each station's task.", "Groups spend 8 minutes per station.", "Close with a whole-class check."] },
  { n: "Flipped classroom", goals: ["Understanding", "Practice"], size: "sml", res: 2, min: 30, lv: "S",
    d: "Students watch or read at home; class time is used for practice and doubts.",
    steps: ["Share a short video or reading on {t} the day before.", "Start class with a 3-question check.", "Use most of the time for practice tasks.", "Clear doubts in small groups."] },
  { n: "Project-based learning", goals: ["Creativity", "Skills"], size: "sm", res: 1, min: 40, lv: "MS",
    d: "Students create a product (model, poster, report) that answers a real question.",
    steps: ["Pose a real-world question about {t}.", "Groups plan their project and roles.", "Work time across lessons with check-ins.", "Present products and give peer feedback."] },
  { n: "Exit tickets and quick checks", goals: ["Revision"], size: "sml", res: 0, min: 5, lv: "PMS",
    d: "Short checks at the end of class show who understood and who needs help.",
    steps: ["Ask one key question about {t}.", "Students write the answer on a slip.", "Sort slips into got it / almost / not yet.", "Start the next lesson with those who need help."] },
  { n: "Gallery walk", goals: ["Discussion", "Revision"], size: "ml", res: 1, min: 20, lv: "MS",
    d: "Groups post work on the walls and move around to comment on each other's ideas.",
    steps: ["Each group prepares a chart on one part of {t}.", "Charts are displayed around the room.", "Groups rotate, adding comments or questions.", "Return to own chart and respond to comments."] }
];
const SIZE = { "Under 20 students": "s", "20–40 students": "m", "More than 40 students": "l" };
const RES = { "Board and chalk only": 0, "Some materials (charts, objects)": 1, "Digital devices available": 2 };
const LV = { "Primary (Classes 1–5)": "P", "Middle (Classes 6–8)": "M", "Secondary (Classes 9–12)": "S" };

SKPlanner({
  key: "strategies", noun: "strategy plan",
  title: (v) => "Strategies: " + (v.topic || "lesson"),
  fields: [
    { id: "topic", label: "Topic", placeholder: "e.g. fractions" },
    { id: "level", label: "Stage", type: "select", options: Object.keys(LV), half: true, ignoreEmpty: true },
    { id: "size", label: "Class size", type: "select", options: Object.keys(SIZE), value: "20–40 students", half: true, ignoreEmpty: true },
    { id: "time", label: "Time available", type: "select", options: ["10 minutes", "20 minutes", "30 minutes", "40 minutes or more"], value: "40 minutes or more", half: true, ignoreEmpty: true },
    { id: "res", label: "Resources", type: "select", options: Object.keys(RES), half: true, ignoreEmpty: true },
    { id: "goals", label: "What do you want to achieve?", type: "checks", options: ["Understanding", "Practice", "Discussion", "Creativity", "Skills", "Revision"], value: ["Understanding"], ignoreEmpty: true },
    { id: "notes", label: "Notes about your class (optional)", type: "textarea", rows: 2, placeholder: "e.g. many first-generation learners, shy students" }
  ],
  example: { topic: "fractions", level: "Primary (Classes 1–5)", size: "More than 40 students", time: "40 minutes or more", res: "Board and chalk only", goals: ["Understanding", "Practice"] },
  render(v, H) {
    const t = v.topic || "the topic", sz = SIZE[v.size] || "m", rs = RES[v.res] ?? 0, lv = LV[v.level] || "P";
    const tm = parseInt(v.time) || 40, goals = v.goals.length ? v.goals : ["Understanding"];
    const scored = STRATS.map((s) => {
      let sc = 0, why = [];
      const g = s.goals.filter((x) => goals.includes(x)); sc += g.length * 3; if (g.length) why.push("supports " + g.join(" & ").toLowerCase());
      if (s.size.includes(sz)) { sc += 2; why.push("suits your class size"); } else sc -= 3;
      if (s.res <= rs) { sc += 1; if (s.res === 0) why.push("needs no special materials"); } else sc -= 4;
      if (s.min <= tm) sc += 1; else sc -= 4;
      if (s.lv.includes(lv)) sc += 2; else sc -= 2;
      return { s, sc, why };
    }).sort((a, b) => b.sc - a.sc).slice(0, 4);
    const top = scored[0].s;
    return `<h2>Recommended strategies: ${H.esc(t)}</h2>
      ${H.meta([["Stage", v.level], ["Class size", v.size], ["Time", v.time], ["Resources", v.res], ["Goals", goals.join(", ")]])}
      ${scored.map(({ s, why }, i) => `<h3>${i + 1}. ${s.n} <span class="badge">${s.min} min</span></h3>
        <p>${H.esc(s.d)}</p><p class="small muted">Why it fits: ${why.join(", ") || "flexible"}.</p>
        ${H.list(s.steps.map((x) => x.replace("{t}", t)), "ol")}`).join("")}
      <h3>Suggested lesson sequence</h3>
      <table><thead><tr><th>Stage</th><th>Strategy</th></tr></thead><tbody>
        <tr><td>Hook (5 min)</td><td>${scored.find((x) => x.s.n === "Storytelling") ? "Storytelling" : "Think-Pair-Share"}: connect ${H.esc(t)} to everyday life</td></tr>
        <tr><td>Main activity</td><td>${top.n}</td></tr>
        <tr><td>Practice</td><td>${(scored[1] || scored[0]).s.n}</td></tr>
        <tr><td>Check (5 min)</td><td>Exit tickets and quick checks</td></tr></tbody></table>
      ${v.notes ? `<h3>Class notes</h3><p>${H.esc(v.notes)}</p>` : ""}`;
  }
});
</script>
</body>
</html>
