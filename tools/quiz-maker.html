<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Maker · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .qitem { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--surface-2); margin-bottom: 12px; }
  .qitem .qh { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .qitem .qh b { flex: 1; font-size: .85rem; color: var(--faint); }
  .opt { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .opt input[type=radio] { accent-color: var(--success); width: 18px; height: 18px; flex: none; }
  .opt .input { padding: 8px 10px; }
  .play { max-width: 820px; margin: 0 auto; }
  .play-q { font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 800; margin: 14px 0 22px; line-height: 1.3; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .answers { grid-template-columns: 1fr; } }
  .ans { text-align: left; padding: 18px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; font-size: 1.08rem; cursor: pointer; display: flex; gap: 12px; align-items: center; }
  .ans:hover { border-color: var(--primary); }
  .ans .k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
  .ans.right { border-color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface)); }
  .ans.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
  .progress { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--grad); transition: width .3s; }
  .fs-target:fullscreen .play { max-width: 1100px; }
  .fs-target:fullscreen .play-q { font-size: 2.6rem; }
</style>
</head>
<body data-root=".." data-page="toolkit">
<main>
  <div id="tool-hero" data-tool="quiz-maker"></div>
  <div class="wrap" style="margin-top:14px">
    <div class="row no-print">
      <div class="seg" id="tabs"><button data-v="edit" class="on">✏️ Edit</button><button data-v="play">▶ Play</button><button data-v="print">🖨 Print</button></div>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" id="share">🔗 Share link</button>
    </div>
  </div>

  <!-- EDIT -->
  <div class="wrap split" id="v-edit">
    <div class="sticky">
      <div class="panel">
        <div class="field"><label for="title">Quiz title</label><input class="input" id="title" placeholder="e.g. Class 4 · Animals quiz"></div>
        <div class="row"><button class="btn btn-primary btn-sm" id="save">Save quiz</button><button class="btn btn-ghost btn-sm" id="new">New quiz</button><button class="btn btn-soft btn-sm" id="example">Example</button></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Quick add</h2></div>
        <p class="small muted">Paste many questions at once. Put a <b>*</b> before the right answer.</p>
        <textarea class="textarea" id="bulk" rows="6" placeholder="Which is the largest planet?&#10;Earth&#10;*Jupiter&#10;Mars&#10;&#10;2 + 3 = ?&#10;*5&#10;6"></textarea>
        <button class="btn btn-ghost btn-sm" id="addBulk" style="margin-top:8px">Add these questions</button>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>My quizzes</h2><span class="badge" id="libCount">0</span></div>
        <ul class="saved" id="lib"></ul>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Questions <span class="badge" id="qCount">0</span></h2><button class="btn btn-soft btn-sm" id="addQ">+ Add question</button></div>
      <div id="qs"></div>
      <button class="btn btn-ghost" id="addQ2" style="width:100%">+ Add question</button>
    </div>
  </div>

  <!-- PLAY -->
  <div class="wrap" id="v-play" hidden style="margin-top:18px">
    <div class="stage fs-target" id="stage">
      <div class="play" id="playBox"></div>
    </div>
  </div>

  <!-- PRINT -->
  <div class="wrap" id="v-print" hidden style="margin-top:18px">
    <div class="panel" id="printBox">
      <div class="panel-head no-print"><h2>Printable quiz</h2>
        <div class="toolbar"><label class="check"><input type="checkbox" id="withKey" checked> <span>Include answer key</span></label>
        <button class="btn btn-ghost btn-sm" id="word">Word</button><button class="btn btn-primary btn-sm" id="printBtn">Print</button></div></div>
      <div class="doc" id="printDoc"></div>
    </div>
  </div>
  <div id="related" data-tool="quiz-maker"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, $$, esc, store, toast, uid, shuffle, encodeShare, decodeShare, copyText, printEl, downloadDoc, celebrate, toggleFullscreen } = SK;
  const COLORS = ["#5b5bd6", "#18a88f", "#f2694a", "#d98a00"], KEYS = ["A", "B", "C", "D"];
  const blankQ = () => ({ q: "", o: ["", "", "", ""], a: 0 });
  const EXAMPLE = { title: "Animals around us", qs: [
    { q: "Which animal is known as the 'ship of the desert'?", o: ["Horse", "Camel", "Elephant", "Donkey"], a: 1 },
    { q: "Where does a bird live?", o: ["Nest", "Den", "Stable", "Kennel"], a: 0 },
    { q: "Which of these animals lays eggs?", o: ["Cow", "Dog", "Hen", "Goat"], a: 2 },
    { q: "What is the young one of a cat called?", o: ["Puppy", "Calf", "Cub", "Kitten"], a: 3 },
    { q: "Which animal has a trunk?", o: ["Elephant", "Giraffe", "Tiger", "Rhino"], a: 0 }
  ] };
  let quiz = store.get("quiz:draft", null) || { id: null, title: "", qs: [blankQ()] };

  /* ---------- views ---------- */
  function view(v) {
    $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    ["edit", "play", "print"].forEach((x) => ($("#v-" + x).hidden = x !== v));
    if (v === "play") startPlay(); if (v === "print") paintPrint();
  }
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) view(b.dataset.v); };

  /* ---------- editor ---------- */
  const valid = () => quiz.qs.filter((x) => x.q.trim() && x.o.filter((o) => o.trim()).length >= 2 && (x.o[x.a] || "").trim());
  const saveDraft = () => store.set("quiz:draft", quiz);
  function paintEditor() {
    $("#title").value = quiz.title;
    $("#qCount").textContent = quiz.qs.length;
    $("#qs").innerHTML = quiz.qs.map((x, i) => `<div class="qitem" data-i="${i}">
      <div class="qh"><b>Question ${i + 1}</b><button class="btn btn-ghost btn-sm" data-up title="Move up">↑</button><button class="btn btn-ghost btn-sm" data-down title="Move down">↓</button><button class="btn btn-danger btn-sm" data-del>Delete</button></div>
      <textarea class="textarea" rows="2" data-q placeholder="Type the question">${esc(x.q)}</textarea>
      ${x.o.map((o, j) => `<label class="opt"><input type="radio" name="a${i}" value="${j}" ${x.a === j ? "checked" : ""} title="Mark as correct answer"><input class="input" data-o="${j}" value="${esc(o)}" placeholder="Option ${KEYS[j]}${j > 1 ? " (optional)" : ""}"></label>`).join("")}
      <p class="small muted" style="margin:6px 0 0">Select the circle next to the correct answer.</p></div>`).join("");
  }
  $("#qs").addEventListener("input", (e) => {
    const it = e.target.closest(".qitem"); if (!it) return; const x = quiz.qs[+it.dataset.i];
    if (e.target.matches("[data-q]")) x.q = e.target.value;
    if (e.target.matches("[data-o]")) x.o[+e.target.dataset.o] = e.target.value;
    if (e.target.type === "radio") x.a = +e.target.value;
    saveDraft();
  });
  $("#qs").addEventListener("change", (e) => { if (e.target.type === "radio") { quiz.qs[+e.target.closest(".qitem").dataset.i].a = +e.target.value; saveDraft(); } });
  $("#qs").addEventListener("click", (e) => {
    const it = e.target.closest(".qitem"); if (!it) return; const i = +it.dataset.i;
    if (e.target.closest("[data-del]")) { quiz.qs.splice(i, 1); if (!quiz.qs.length) quiz.qs.push(blankQ()); }
    else if (e.target.closest("[data-up]") && i > 0) [quiz.qs[i - 1], quiz.qs[i]] = [quiz.qs[i], quiz.qs[i - 1]];
    else if (e.target.closest("[data-down]") && i < quiz.qs.length - 1) [quiz.qs[i + 1], quiz.qs[i]] = [quiz.qs[i], quiz.qs[i + 1]];
    else return;
    saveDraft(); paintEditor();
  });
  $("#title").oninput = (e) => { quiz.title = e.target.value; saveDraft(); };
  const addQ = () => { quiz.qs.push(blankQ()); saveDraft(); paintEditor(); $$(".qitem [data-q]").pop().focus(); };
  $("#addQ").onclick = addQ; $("#addQ2").onclick = addQ;
  $("#new").onclick = () => { if (confirm("Start a new empty quiz? Unsaved changes will be lost.")) { quiz = { id: null, title: "", qs: [blankQ()] }; saveDraft(); paintEditor(); } };
  $("#example").onclick = () => { quiz = JSON.parse(JSON.stringify(Object.assign({ id: null }, EXAMPLE))); saveDraft(); paintEditor(); };
  $("#addBulk").onclick = () => {
    const blocks = $("#bulk").value.split(/\n\s*\n/).map((b) => b.split("\n").map((s) => s.trim()).filter(Boolean)).filter((b) => b.length >= 3);
    if (!blocks.length) { toast("Write a question, then 2–4 options on the next lines"); return; }
    const add = blocks.map((b) => { const opts = b.slice(1, 5); let a = opts.findIndex((o) => o.startsWith("*")); if (a < 0) a = 0;
      const o = opts.map((s) => s.replace(/^\*\s*/, "").replace(/^[A-Da-d][).]\s*/, "")); while (o.length < 4) o.push("");
      return { q: b[0].replace(/^\d+[.)]\s*/, ""), o, a }; });
    quiz.qs = quiz.qs.filter((x) => x.q.trim()).concat(add); $("#bulk").value = ""; saveDraft(); paintEditor(); toast("Added " + add.length + " questions");
  };

  /* ---------- library ---------- */
  const lib = () => store.get("quizzes", []);
  function paintLib() {
    const l = lib(); $("#libCount").textContent = l.length;
    $("#lib").innerHTML = l.length ? l.map((z) => `<li data-id="${z.id}"><span class="s-name">${esc(z.title || "Untitled quiz")}</span><small class="muted">${z.qs.length} Q</small><button data-open>Open</button><button data-del aria-label="Delete">✕</button></li>`).join("")
      : '<li class="muted">Saved quizzes appear here.</li>';
  }
  $("#save").onclick = () => {
    if (!valid().length) { toast("Add at least one complete question"); return; }
    const l = lib(); if (!quiz.id) quiz.id = uid();
    const i = l.findIndex((z) => z.id === quiz.id), copy = JSON.parse(JSON.stringify(quiz));
    if (i >= 0) l[i] = copy; else l.unshift(copy);
    store.set("quizzes", l); saveDraft(); paintLib(); toast("Quiz saved");
  };
  $("#lib").onclick = (e) => {
    const li = e.target.closest("li[data-id]"); if (!li) return; const l = lib(), z = l.find((x) => x.id === li.dataset.id);
    if (e.target.closest("[data-open]")) { quiz = JSON.parse(JSON.stringify(z)); saveDraft(); paintEditor(); toast("Opened " + (z.title || "quiz")); }
    if (e.target.closest("[data-del]") && confirm("Delete this quiz?")) { store.set("quizzes", l.filter((x) => x.id !== z.id)); paintLib(); }
  };

  /* ---------- share ---------- */
  $("#share").onclick = () => {
    const qs = valid(); if (!qs.length) { toast("Add at least one complete question"); return; }
    const link = location.href.split("#")[0] + "#play=" + encodeShare({ t: quiz.title, q: qs.map((x) => [x.q, x.o.filter((o) => o.trim()), x.a]) });
    copyText(link); toast("Link copied. Anyone with it can play this quiz.");
  };

  /* ---------- play ---------- */
  let P = null;
  function startPlay(fromShare) {
    const qs = fromShare || valid();
    if (!qs.length) { $("#playBox").innerHTML = '<div class="empty"><div class="e-icon">🧠</div><p>Add some questions in <b>Edit</b> first.</p></div>'; return; }
    P = { qs: shuffle(qs).map((x) => { const idx = shuffle(x.o.map((o, j) => j).filter((j) => (x.o[j] || "").trim())); return { q: x.q, o: idx.map((j) => x.o[j]), a: idx.indexOf(x.a) }; }), i: 0, score: 0, title: fromShare ? P0.t : quiz.title };
    paintQ();
  }
  function paintQ() {
    const x = P.qs[P.i];
    $("#playBox").innerHTML = `<div class="row"><b>${esc(P.title || "Quiz")}</b><span class="spacer"></span><span class="badge">Question ${P.i + 1} / ${P.qs.length}</span><span class="badge badge-ready">Score ${P.score}</span>
      <button class="btn btn-ghost btn-sm no-print" id="fsBtn">⛶</button></div>
      <div class="progress" style="margin-top:12px"><i style="width:${(P.i / P.qs.length) * 100}%"></i></div>
      <div class="play-q">${esc(x.q)}</div>
      <div class="answers">${x.o.map((o, j) => `<button class="ans" data-j="${j}"><span class="k" style="background:${COLORS[j]}">${KEYS[j]}</span>${esc(o)}</button>`).join("")}</div>
      <div id="after" style="margin-top:20px;min-height:48px"></div>`;
    $("#fsBtn").onclick = () => toggleFullscreen($("#stage"));
  }
  $("#playBox").addEventListener("click", (e) => {
    const b = e.target.closest(".ans");
    if (b && !b.disabled) {
      const x = P.qs[P.i], j = +b.dataset.j;
      $$(".ans").forEach((a) => { a.disabled = true; if (+a.dataset.j === x.a) a.classList.add("right"); });
      if (j === x.a) { P.score++; $("#after").innerHTML = '<b style="color:var(--success);font-size:1.2rem">✔ Correct!</b>'; }
      else { b.classList.add("wrong", "shake"); $("#after").innerHTML = `<b style="color:var(--danger)">✘ The answer is ${KEYS[x.a]}: ${esc(x.o[x.a])}</b>`; }
      $("#after").innerHTML += ` <button class="btn btn-primary" id="nextQ" style="margin-left:12px">${P.i + 1 < P.qs.length ? "Next question →" : "See result"}</button>`;
      $("#nextQ").focus();
    }
    if (e.target.id === "nextQ") {
      P.i++;
      if (P.i < P.qs.length) paintQ();
      else {
        const pct = Math.round((P.score / P.qs.length) * 100);
        if (pct >= 60) celebrate();
        $("#playBox").innerHTML = `<div class="empty"><div class="e-icon">${pct >= 80 ? "🏆" : pct >= 50 ? "👏" : "💪"}</div>
          <h2 style="font-size:2rem">${P.score} / ${P.qs.length}</h2><p>${pct >= 80 ? "Excellent work!" : pct >= 50 ? "Good job! Keep practising." : "Nice try! Let's practise again."}</p>
          <button class="btn btn-primary btn-lg" id="replay">Play again</button></div>`;
      }
    }
    if (e.target.id === "replay") startPlay(P0 ? P0.qs : null);
  });

  /* ---------- print ---------- */
  function paintPrint() {
    const qs = valid(), key = $("#withKey").checked;
    $("#printDoc").innerHTML = qs.length ? `<h2>${esc(quiz.title || "Quiz")}</h2>
      <div class="meta"><div><b>Name</b>______________</div><div><b>Class</b>________</div><div><b>Date</b>________</div><div><b>Score</b>_____ / ${qs.length}</div></div>
      <ol>${qs.map((x) => `<li style="margin-bottom:12px"><b>${esc(x.q)}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px">${x.o.filter((o) => o.trim()).map((o, j) => `<span>(${KEYS[j].toLowerCase()}) ${esc(o)}</span>`).join("")}</div></li>`).join("")}</ol>
      ${key ? `<h3 style="page-break-before:always">Answer key</h3><p>${qs.map((x, i) => `${i + 1}. (${KEYS[x.a].toLowerCase()}) ${esc(x.o[x.a])}`).join(" &nbsp; · &nbsp; ")}</p>` : ""}`
      : '<div class="empty"><p>Add questions in <b>Edit</b> first.</p></div>';
  }
  $("#withKey").onchange = paintPrint;
  $("#printBtn").onclick = () => printEl($("#printBox"));
  $("#word").onclick = () => downloadDoc(quiz.title || "quiz", $("#printDoc"));

  /* ---------- start ---------- */
  let P0 = null;
  const m = location.hash.match(/play=([\w-]+)/);
  if (m) {
    const d = decodeShare(m[1]);
    if (d && d.q) {
      P0 = { t: d.t, qs: d.q.map(([q, o, a]) => ({ q, o, a })) };
      document.querySelector("#tabs button[data-v=edit]").hidden = true; document.querySelector("#tabs button[data-v=print]").hidden = true;
      $("#share").hidden = true;
      $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === "play"));
      ["edit", "print"].forEach((x) => ($("#v-" + x).hidden = true)); $("#v-play").hidden = false;
      startPlay(P0.qs);
    } else toast("This quiz link is not valid");
  }
  paintEditor(); paintLib();
})();
</script>
</body>
</html>
