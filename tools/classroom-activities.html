<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Interactive Activities · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .pane { display: none; } .pane.on { display: block; }
  .ring { width: min(320px, 70vw); aspect-ratio: 1; margin: 0 auto 18px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .big-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(3rem, 10vw, 4.6rem); }
  .wheel-box { position: relative; width: min(440px, 86vw); margin: 0 auto; }
  .wheel-box canvas { width: 100%; height: auto; display: block; }
  .wheel-box .pin { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--text); z-index: 2; }
  .dice { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: 10px 0 24px; }
  .die { width: 120px; height: 120px; border-radius: 24px; background: var(--surface); border: 2px solid var(--border); box-shadow: 0 8px 0 var(--border); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 16px; }
  .die i { width: 20px; height: 20px; border-radius: 50%; background: var(--text); place-self: center; }
  .die.roll { animation: roll .6s ease; }
  @keyframes roll { 0% { transform: rotate(0); } 50% { transform: rotate(200deg) scale(.85); } 100% { transform: rotate(360deg); } }
  .light { display: flex; flex-direction: column; gap: 14px; background: #222; padding: 18px; border-radius: 30px; width: 150px; margin: 0 auto; }
  .light button { width: 114px; height: 114px; border-radius: 50%; border: 0; opacity: .22; cursor: pointer; }
  .light button.on { opacity: 1; box-shadow: 0 0 40px currentColor; }
  .sb { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .sb .t { background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px; padding: 16px; text-align: center; border-top: 6px solid var(--c); }
  .sb .t input { border: 0; background: transparent; text-align: center; font-weight: 800; font-size: 1.1rem; width: 100%; }
  .sb .t b { display: block; font-size: 3.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .picked { font-size: clamp(2.4rem, 8vw, 4.5rem); font-weight: 800; min-height: 1.3em; letter-spacing: -.02em; }
</style>
</head>
<body data-root=".." data-page="toolkit">
<main>
  <div id="tool-hero" data-tool="classroom-activities"></div>
  <div class="wrap" style="margin-top:16px">
    <div class="seg" id="tabs" style="margin-bottom:16px">
      <button data-p="timer" class="on">⏱️ Timer</button><button data-p="picker">🙋 Name picker</button><button data-p="wheel">🎡 Spin wheel</button>
      <button data-p="dice">🎲 Dice</button><button data-p="score">🏅 Scoreboard</button><button data-p="noise">🚦 Noise signal</button>
    </div>
    <div class="stage fs-target" id="stage">
      <div class="row no-print" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" id="fs">⛶ Full screen</button></div>

      <section class="pane on" id="p-timer">
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--bg-soft)" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="45" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/></svg><div class="big-num" id="tDisp">02:00</div></div>
        <div class="chips" style="justify-content:center;margin-bottom:14px" id="presets"></div>
        <div class="row" style="justify-content:center">
          <input class="input" id="tMin" type="number" min="0" max="180" value="2" style="width:80px" aria-label="Minutes"><span>min</span>
          <input class="input" id="tSec" type="number" min="0" max="59" value="0" style="width:80px" aria-label="Seconds"><span>sec</span>
          <button class="btn btn-primary btn-lg" id="tGo">Start</button><button class="btn btn-ghost btn-lg" id="tReset">Reset</button>
        </div>
      </section>

      <section class="pane" id="p-picker">
        <div class="picked" id="pickOut">Ready?</div>
        <p class="muted" id="pickInfo"></p>
        <div class="row" style="justify-content:center;margin-bottom:18px">
          <button class="btn btn-primary btn-lg" id="pickGo">🙋 Pick a name</button>
          <label class="check"><input type="checkbox" id="noRepeat" checked> <span>Don't repeat until everyone is picked</span></label>
        </div>
        <div class="grid-2" style="text-align:left;max-width:700px;margin:0 auto">
          <div class="field"><label for="pickNames">Names (one per line)</label><textarea class="textarea" id="pickNames" rows="6"></textarea></div>
          <div class="field"><label for="pickClass">Load a saved class</label><select class="select" id="pickClass"><option value="">Choose…</option></select>
            <span class="hint">Save class lists in the Group Activity Creator.</span><button class="btn btn-ghost btn-sm" id="pickReset" style="margin-top:8px;align-self:flex-start">Start over</button></div>
        </div>
      </section>

      <section class="pane" id="p-wheel">
        <div class="wheel-box"><div class="pin"></div><canvas id="wheel" width="600" height="600"></canvas></div>
        <div class="picked" id="wheelOut" style="font-size:2rem;margin-top:12px"></div>
        <div class="row" style="justify-content:center;margin:10px 0"><button class="btn btn-primary btn-lg" id="spin">🎡 Spin</button></div>
        <div class="field" style="max-width:520px;margin:0 auto;text-align:left"><label for="wheelItems">Wheel items (one per line)</label><textarea class="textarea" id="wheelItems" rows="5"></textarea></div>
      </section>

      <section class="pane" id="p-dice">
        <div class="dice" id="diceBox"></div>
        <div class="row" style="justify-content:center"><button class="btn btn-primary btn-lg" id="roll">🎲 Roll</button>
          <select class="select" id="nDice" style="width:auto"><option value="1">1 die</option><option value="2" selected>2 dice</option><option value="3">3 dice</option></select></div>
        <p class="big-num" id="diceSum" style="font-size:2.4rem;margin-top:16px"></p>
      </section>

      <section class="pane" id="p-score">
        <div class="sb" id="sb"></div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-ghost" id="addTeam">+ Team</button><button class="btn btn-ghost" id="resetScore">Reset scores</button></div>
      </section>

      <section class="pane" id="p-noise">
        <div class="light" id="light"><button style="background:#e5484d;color:#e5484d" data-l="0" aria-label="Red: silence"></button><button style="background:#f5b400;color:#f5b400" data-l="1" aria-label="Amber: whisper"></button><button style="background:#2aa876;color:#2aa876" data-l="2" aria-label="Green: group talk"></button></div>
        <p class="picked" id="noiseTxt" style="font-size:2rem;margin-top:18px">Tap a light</p>
      </section>
    </div>
  </div>
  <div id="related" data-tool="classroom-activities"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, $$, esc, store, shuffle, toast, speak, celebrate, toggleFullscreen } = SK;
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $$(".pane").forEach((p) => p.classList.toggle("on", p.id === "p-" + b.dataset.p)); if (b.dataset.p === "wheel") drawWheel(); store.set("cls:tab", b.dataset.p); };
  $("#fs").onclick = () => toggleFullscreen($("#stage"));

  /* beep with Web Audio (no files) */
  let ac; function beep(f = 880, d = .18, n = 1) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination); const t = ac.currentTime + i * .28; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.start(t); o.stop(t + d); } } catch (e) {} }

  /* ---------- Timer ---------- */
  let total = 120, left = 120, run = null, endAt = 0;
  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  function paintT() { $("#tDisp").textContent = fmt(Math.ceil(left)); $("#arc").style.strokeDashoffset = 282.7 * (1 - left / (total || 1)); $("#arc").style.stroke = left < 10 && left > 0 ? "var(--coral)" : "var(--primary)"; }
  function setT() { total = left = (+$("#tMin").value || 0) * 60 + (+$("#tSec").value || 0); stopT(); paintT(); }
  function stopT() { clearInterval(run); run = null; $("#tGo").textContent = "Start"; }
  $("#tGo").onclick = () => {
    if (run) { stopT(); return; }
    if (left <= 0) setT(); if (left <= 0) return;
    endAt = Date.now() + left * 1000; $("#tGo").textContent = "Pause";
    run = setInterval(() => { left = Math.max(0, (endAt - Date.now()) / 1000); paintT(); if (left <= 0) { stopT(); beep(880, .25, 3); $("#tDisp").classList.add("pop"); toast("⏰ Time's up!"); } }, 200);
  };
  $("#tReset").onclick = setT; $("#tMin").oninput = setT; $("#tSec").oninput = setT;
  $("#presets").innerHTML = [[30, "30 s"], [60, "1 min"], [120, "2 min"], [300, "5 min"], [600, "10 min"], [900, "15 min"]].map(([s, l]) => `<button class="chip" data-s="${s}">${l}</button>`).join("");
  $("#presets").onclick = (e) => { const b = e.target.closest("[data-s]"); if (!b) return; $("#tMin").value = Math.floor(b.dataset.s / 60); $("#tSec").value = b.dataset.s % 60; setT(); };
  paintT();

  /* ---------- Name picker ---------- */
  const classes = store.get("classes", []);
  $("#pickClass").innerHTML += classes.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join("");
  $("#pickNames").value = store.get("picker:names", "Aarav\nDiya\nKabir\nAnanya\nIshaan\nMeera\nRohan\nSara");
  let pool = [];
  const names = () => $("#pickNames").value.split("\n").map((s) => s.trim()).filter((s) => s && !s.startsWith("#"));
  const info = () => { $("#pickInfo").textContent = $("#noRepeat").checked ? `${pool.length} of ${names().length} not picked yet` : names().length + " names"; };
  const resetPool = () => { pool = shuffle(names()); info(); };
  $("#pickNames").oninput = () => { store.set("picker:names", $("#pickNames").value); resetPool(); };
  $("#pickClass").onchange = (e) => { if (e.target.value === "") return; $("#pickNames").value = classes[+e.target.value].names; store.set("picker:names", $("#pickNames").value); resetPool(); };
  $("#pickReset").onclick = () => { resetPool(); $("#pickOut").textContent = "Ready?"; };
  $("#noRepeat").onchange = info;
  $("#pickGo").onclick = () => {
    const all = names(); if (!all.length) return toast("Add some names");
    if (!pool.length) resetPool();
    let n = 0; const b = $("#pickGo"); b.disabled = true;
    const iv = setInterval(() => { $("#pickOut").textContent = all[Math.floor(Math.random() * all.length)]; beep(300 + n * 25, .04); if (++n > 16) {
      clearInterval(iv); const nm = $("#noRepeat").checked ? pool.pop() : all[Math.floor(Math.random() * all.length)];
      $("#pickOut").textContent = nm; $("#pickOut").classList.remove("pop"); void $("#pickOut").offsetWidth; $("#pickOut").classList.add("pop"); beep(990, .2); b.disabled = false; info(); } }, 70);
  };
  resetPool();

  /* ---------- Spin wheel ---------- */
  const WC = ["#5b5bd6", "#18a88f", "#f2694a", "#e2a400", "#2f8ee0", "#d6456f", "#8e4ec6", "#12a594"];
  $("#wheelItems").value = store.get("wheel:items", "Read aloud\nSpell a word\nAsk a question\nAct it out\nDraw it\nBonus star ⭐");
  let ang = 0, spinning = false;
  const items = () => $("#wheelItems").value.split("\n").map((s) => s.trim()).filter(Boolean);
  function drawWheel() {
    const c = $("#wheel"), x = c.getContext("2d"), it = items(), n = Math.max(it.length, 1), R = 290;
    x.clearRect(0, 0, 600, 600); x.save(); x.translate(300, 300); x.rotate(ang);
    it.forEach((t, i) => {
      const a0 = (i / n) * 2 * Math.PI, a1 = ((i + 1) / n) * 2 * Math.PI;
      x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a1); x.fillStyle = WC[i % WC.length]; x.fill(); x.strokeStyle = "#fff"; x.lineWidth = 3; x.stroke();
      x.save(); x.rotate((a0 + a1) / 2); x.fillStyle = "#fff"; x.font = "bold " + (n > 10 ? 18 : 24) + "px Plus Jakarta Sans, sans-serif"; x.textAlign = "right"; x.textBaseline = "middle";
      x.fillText(t.length > 18 ? t.slice(0, 17) + "…" : t, R - 18, 0); x.restore();
    });
    x.beginPath(); x.arc(0, 0, 34, 0, 2 * Math.PI); x.fillStyle = "#fff"; x.fill(); x.restore();
  }
  $("#wheelItems").oninput = () => { store.set("wheel:items", $("#wheelItems").value); drawWheel(); };
  $("#spin").onclick = () => {
    const it = items(); if (it.length < 2 || spinning) return it.length < 2 && toast("Add at least 2 items");
    spinning = true; $("#wheelOut").textContent = "";
    const start = ang, delta = 2 * Math.PI * (5 + Math.random() * 3), dur = 4200, t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); ang = start + delta * e; drawWheel();
      if (p < 1) requestAnimationFrame(step);
      else { spinning = false; const n = it.length, top = ((((-Math.PI / 2 - ang) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)); const i = Math.floor((top / (2 * Math.PI)) * n);
        $("#wheelOut").textContent = "👉 " + it[i]; beep(990, .2); }
    })(t0);
  };

  /* ---------- Dice ---------- */
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const dieHTML = (v) => `<div class="die roll" aria-label="${v}">${Array.from({ length: 9 }, (_, i) => PIPS[v].includes(i + 1) ? "<i></i>" : "<span></span>").join("")}</div>`;
  function roll() { const n = +$("#nDice").value, vs = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6)); $("#diceBox").innerHTML = vs.map(dieHTML).join(""); $("#diceSum").textContent = n > 1 ? "Total: " + vs.reduce((a, b) => a + b, 0) : ""; beep(500, .08, 2); }
  $("#roll").onclick = roll; $("#nDice").onchange = roll; roll();

  /* ---------- Scoreboard ---------- */
  const SC = ["#5b5bd6", "#18a88f", "#f2694a", "#e2a400", "#2f8ee0", "#d6456f"];
  let teams = store.get("score:teams", [{ n: "Team 1", s: 0 }, { n: "Team 2", s: 0 }]);
  function paintSB() {
    store.set("score:teams", teams);
    $("#sb").innerHTML = teams.map((t, i) => `<div class="t" style="--c:${SC[i % SC.length]}"><input value="${esc(t.n)}" data-n="${i}" aria-label="Team name"><b>${t.s}</b>
      <div class="row" style="justify-content:center"><button class="btn btn-ghost btn-sm" data-i="${i}" data-d="-1">−1</button><button class="btn btn-soft btn-sm" data-i="${i}" data-d="1">+1</button><button class="btn btn-soft btn-sm" data-i="${i}" data-d="5">+5</button>${teams.length > 2 ? `<button class="btn btn-ghost btn-sm" data-x="${i}" aria-label="Remove team">✕</button>` : ""}</div></div>`).join("");
  }
  $("#sb").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.x != null) teams.splice(+b.dataset.x, 1); else { teams[+b.dataset.i].s += +b.dataset.d; beep(660, .08); } paintSB(); };
  $("#sb").oninput = (e) => { if (e.target.dataset.n != null) { teams[+e.target.dataset.n].n = e.target.value; store.set("score:teams", teams); } };
  $("#addTeam").onclick = () => { if (teams.length < 8) { teams.push({ n: "Team " + (teams.length + 1), s: 0 }); paintSB(); } };
  $("#resetScore").onclick = () => { if (confirm("Reset all scores to 0?")) { teams.forEach((t) => (t.s = 0)); paintSB(); } };
  paintSB();

  /* ---------- Noise signal ---------- */
  const NT = ["🤫 Silence please", "🗣️ Whisper voices", "👥 Group talk is OK"];
  $("#light").onclick = (e) => { const b = e.target.closest("[data-l]"); if (!b) return; $$("#light button").forEach((x) => x.classList.toggle("on", x === b)); $("#noiseTxt").textContent = NT[+b.dataset.l]; };

  const tab = store.get("cls:tab", null); if (tab) { const b = $(`#tabs [data-p="${tab}"]`); if (b) b.click(); }
})();
</script>
</body>
</html>
