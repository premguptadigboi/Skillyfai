<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educational Game Creator · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .cats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .board { display: grid; gap: 8px; }
  .board .bh { background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 8px; text-align: center; font-weight: 800; font-size: .95rem; display: grid; place-items: center; min-height: 58px; }
  .cell { border: 0; border-radius: 12px; min-height: 72px; font-size: 1.6rem; font-weight: 800; color: #fff; cursor: pointer; background: var(--primary); box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 55%, #000); }
  .cell:hover { filter: brightness(1.08); }
  .cell.used { background: var(--bg-soft); color: var(--faint); box-shadow: none; cursor: default; }
  .teams { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .team { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 18px; text-align: center; min-width: 120px; }
  .team b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .team .adj { display: flex; gap: 4px; justify-content: center; }
  .team .adj button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 30px; height: 26px; cursor: pointer; }
  .modal { position: fixed; inset: 0; background: rgba(10, 10, 30, .6); display: grid; place-items: center; z-index: 100; padding: 16px; }
  .modal-card { background: var(--surface); border-radius: 24px; padding: 32px; max-width: 760px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); }
  .modal-card .mq { font-size: clamp(1.4rem, 3.5vw, 2.3rem); font-weight: 800; margin: 12px 0 18px; line-height: 1.3; }
  .modal-card .ma { font-size: 1.4rem; color: var(--success); font-weight: 800; margin-bottom: 18px; }
</style>
</head>
<body data-root=".." data-page="toolkit">
<main>
  <div id="tool-hero" data-tool="game-creator" data-sub="Build a points board with categories and questions. Teams pick a square, answer, and win points. Great on a projector."></div>
  <div class="wrap" style="margin-top:14px">
    <div class="row"><div class="seg" id="tabs"><button data-v="edit" class="on">✏️ Create</button><button data-v="play">▶ Play</button></div>
    <span class="spacer"></span><button class="btn btn-soft btn-sm" id="example">Load example</button><button class="btn btn-primary btn-sm" id="save">Save game</button></div>
  </div>

  <div class="wrap" id="v-edit" style="margin-top:16px">
    <div class="panel">
      <div class="grid-2">
        <div class="field"><label for="gTitle">Game title</label><input class="input" id="gTitle" placeholder="e.g. Science Super Quiz"></div>
        <div class="field"><label for="gTeams">Teams (comma separated)</label><input class="input" id="gTeams" value="Team A, Team B, Team C"></div>
      </div>
      <p class="small muted">Write up to 5 questions per category, one per line, as <b>question | answer</b>. Points go 100, 200, 300… from top to bottom.</p>
      <div class="cats" id="cats"></div>
      <div class="row" style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="addCat">+ Category</button><button class="btn btn-ghost btn-sm" id="delCat">− Category</button></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Saved games</h2></div><ul class="saved" id="lib"></ul></div>
  </div>

  <div class="wrap" id="v-play" hidden style="margin-top:16px">
    <div class="stage fs-target" id="stage">
      <div class="row" style="margin-bottom:14px"><h2 id="pTitle" style="margin:0"></h2><span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="reset">Reset board</button><button class="btn btn-ghost btn-sm" id="fs">⛶ Full screen</button></div>
      <div class="board" id="board"></div>
      <div class="teams" id="teams"></div>
    </div>
  </div>
  <div id="related" data-tool="game-creator"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, $$, esc, h, store, toast, uid, toggleFullscreen, celebrate } = SK;
  const EX = { title: "General Knowledge Challenge", teams: "Tigers, Eagles, Dolphins", cats: [
    { n: "Animals", t: "Which animal is called the king of the jungle? | Lion\nHow many legs does a spider have? | Eight\nWhich bird cannot fly but runs fast? | Ostrich\nWhat do we call a baby frog? | Tadpole\nWhich animal is India's national animal? | Tiger" },
    { n: "Maths", t: "5 + 7 = ? | 12\nHow many sides does a hexagon have? | Six\n9 × 6 = ? | 54\nHalf of 150 is? | 75\nWhat is 25% of 200? | 50" },
    { n: "Our Earth", t: "Which planet do we live on? | Earth\nWhat is the largest ocean? | Pacific Ocean\nWhat gas do plants take in? | Carbon dioxide\nWhich is the longest river in India? | Ganga\nWhat causes day and night? | Rotation of the Earth" },
    { n: "Words", t: "Opposite of 'hot'? | Cold\nPlural of 'child'? | Children\nA word that means 'very big'? | Huge / enormous\nWhat is a naming word called? | Noun\nSpell the number 8 | E-I-G-H-T" }
  ] };
  let G = store.get("game:draft", null) || JSON.parse(JSON.stringify(EX));
  let used = new Set(), scores = [];

  function paintEdit() {
    $("#gTitle").value = G.title; $("#gTeams").value = G.teams;
    $("#cats").innerHTML = G.cats.map((c, i) => `<div class="field" style="margin:0"><input class="input" data-n="${i}" value="${esc(c.n)}" placeholder="Category ${i + 1}" style="font-weight:700;margin-bottom:6px">
      <textarea class="textarea" data-t="${i}" rows="6" placeholder="Question | Answer">${esc(c.t)}</textarea></div>`).join("");
  }
  const save = () => store.set("game:draft", G);
  $("#v-edit").addEventListener("input", (e) => {
    if (e.target.id === "gTitle") G.title = e.target.value;
    if (e.target.id === "gTeams") G.teams = e.target.value;
    if (e.target.dataset.n != null) G.cats[+e.target.dataset.n].n = e.target.value;
    if (e.target.dataset.t != null) G.cats[+e.target.dataset.t].t = e.target.value;
    save();
  });
  $("#addCat").onclick = () => { if (G.cats.length >= 6) return toast("Up to 6 categories"); G.cats.push({ n: "", t: "" }); save(); paintEdit(); };
  $("#delCat").onclick = () => { if (G.cats.length <= 1) return; G.cats.pop(); save(); paintEdit(); };
  $("#example").onclick = () => { G = JSON.parse(JSON.stringify(EX)); save(); paintEdit(); toast("Example loaded"); };

  const lib = () => store.get("games", []);
  function paintLib() {
    $("#lib").innerHTML = lib().map((g) => `<li data-id="${g.id}"><span class="s-name">${esc(g.title || "Untitled game")}</span><button data-o>Open</button><button data-d>✕</button></li>`).join("") || '<li class="muted">Saved games appear here.</li>';
  }
  $("#save").onclick = () => { const l = lib(); if (!G.id) G.id = uid(); const i = l.findIndex((x) => x.id === G.id); const c = JSON.parse(JSON.stringify(G)); i >= 0 ? (l[i] = c) : l.unshift(c); store.set("games", l); save(); paintLib(); toast("Game saved"); };
  $("#lib").onclick = (e) => { const li = e.target.closest("li[data-id]"); if (!li) return; const l = lib(), g = l.find((x) => x.id === li.dataset.id);
    if (e.target.closest("[data-o]")) { G = JSON.parse(JSON.stringify(g)); save(); paintEdit(); toast("Opened"); }
    if (e.target.closest("[data-d]") && confirm("Delete this game?")) { store.set("games", l.filter((x) => x.id !== g.id)); paintLib(); } };

  /* ---------- play ---------- */
  const parsed = () => G.cats.map((c) => ({ n: c.n || "Category", qs: c.t.split("\n").map((l) => l.split("|")).filter((p) => p[0].trim()).slice(0, 5).map((p) => ({ q: p[0].trim(), a: (p[1] || "").trim() })) }));
  const teams = () => G.teams.split(",").map((t) => t.trim()).filter(Boolean).slice(0, 8);
  function paintBoard() {
    const cs = parsed(), rows = Math.max(...cs.map((c) => c.qs.length), 0);
    $("#pTitle").textContent = G.title || "Quiz board";
    const b = $("#board"); b.style.gridTemplateColumns = `repeat(${cs.length}, minmax(0,1fr))`;
    let html = cs.map((c) => `<div class="bh">${esc(c.n)}</div>`).join("");
    for (let r = 0; r < rows; r++) html += cs.map((c, ci) => c.qs[r] ? `<button class="cell ${used.has(ci + "-" + r) ? "used" : ""}" data-c="${ci}" data-r="${r}">${(r + 1) * 100}</button>` : "<div></div>").join("");
    b.innerHTML = html;
    const tn = teams(); if (scores.length !== tn.length) scores = tn.map(() => 0);
    $("#teams").innerHTML = tn.map((t, i) => `<div class="team"><span>${esc(t)}</span><b>${scores[i]}</b><div class="adj"><button data-t="${i}" data-d="-100">−</button><button data-t="${i}" data-d="100">+</button></div></div>`).join("");
  }
  $("#teams").onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) { scores[+b.dataset.t] += +b.dataset.d; paintBoard(); } };
  $("#board").onclick = (e) => {
    const c = e.target.closest(".cell"); if (!c || c.classList.contains("used")) return;
    const ci = +c.dataset.c, r = +c.dataset.r, q = parsed()[ci].qs[r], pts = (r + 1) * 100;
    const m = h(`<div class="modal" role="dialog" aria-modal="true"><div class="modal-card">
      <span class="badge">${esc(parsed()[ci].n)} · ${pts} points</span><div class="mq">${esc(q.q)}</div>
      <div class="ma" hidden>${esc(q.a || "(no answer written)")}</div>
      <button class="btn btn-primary btn-lg" data-show>Show answer</button>
      <div data-award hidden><p class="muted">Who gets the points?</p><div class="row" style="justify-content:center">${teams().map((t, i) => `<button class="btn btn-soft" data-win="${i}">${esc(t)}</button>`).join("")}<button class="btn btn-ghost" data-win="-1">No one</button></div></div>
    </div></div>`);
    $("#stage").append(m);
    m.onclick = (ev) => {
      if (ev.target.closest("[data-show]")) { $(".ma", m).hidden = false; $("[data-award]", m).hidden = false; ev.target.closest("[data-show]").hidden = true; }
      const w = ev.target.closest("[data-win]");
      if (w) { const i = +w.dataset.win; if (i >= 0) scores[i] += pts; used.add(ci + "-" + r); m.remove(); paintBoard(); checkEnd(); }
    };
  };
  function checkEnd() {
    const total = parsed().reduce((s, c) => s + c.qs.length, 0);
    if (used.size >= total && total) { const best = Math.max(...scores); const win = teams().filter((t, i) => scores[i] === best);
      celebrate(); toast("🏆 Winner: " + win.join(" & ") + " with " + best + " points!"); }
  }
  $("#reset").onclick = () => { if (confirm("Clear the board and scores?")) { used = new Set(); scores = []; paintBoard(); } };
  $("#fs").onclick = () => toggleFullscreen($("#stage"));
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
    $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
    $("#v-edit").hidden = b.dataset.v !== "edit"; $("#v-play").hidden = b.dataset.v !== "play";
    if (b.dataset.v === "play") paintBoard(); };
  paintEdit(); paintLib();
})();
</script>
</body>
</html>
