<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Development · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .vgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .vcard { background: var(--surface); border: 2px solid var(--border); border-radius: 20px; padding: 18px; text-align: center; cursor: pointer; transition: transform .15s; box-shadow: 0 5px 0 var(--border); }
  .vcard:hover { transform: translateY(-3px); border-color: var(--mint); }
  .vcard .em { font-size: 3.2rem; line-height: 1.1; }
  .vcard h3 { font-family: var(--font-kid); font-size: 1.6rem; margin: 6px 0 4px; }
  .vcard p { font-size: .9rem; color: var(--muted); margin: 0 0 4px; }
  .vcard .ex { font-family: var(--font-kid); font-style: italic; color: var(--text); }
  .wotd { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; background: linear-gradient(135deg, var(--mint-soft), var(--amber-soft)); border-radius: 22px; padding: 22px 24px; margin-bottom: 18px; border: 1px solid var(--border); }
  .wotd .em { font-size: 3.6rem; }
  @media (max-width: 600px) { .wotd { grid-template-columns: 1fr; text-align: center; } }
  .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 560px; margin: 18px auto 0; }
  .opts button { font-family: var(--font-kid); font-size: 1.4rem; font-weight: 700; padding: 18px 10px; border-radius: 18px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text); box-shadow: 0 4px 0 var(--border); }
  .opts button .em { font-size: 2.6rem; display: block; }
  .opts button.right { border-color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface)); }
  .opts button.wrong { border-color: var(--danger); }
</style>
</head>
<body data-root=".." data-page="reading">
<main>
  <div id="tool-hero" data-tool="vocabulary"></div>
  <div class="wrap" style="margin-top:16px">
    <div class="wotd kid" id="wotd"></div>
    <div class="row" style="margin-bottom:14px">
      <div class="chips" id="themes"></div><span class="spacer"></span>
      <div class="seg" id="mode"><button data-m="learn" class="on">📚 Learn</button><button data-m="listen">👂 Listen &amp; choose</button><button data-m="meaning">💭 Meaning game</button></div>
    </div>
    <div id="learn" class="vgrid kid"></div>
    <div id="game" class="kid-card kid center" hidden></div>
    <div class="panel" style="margin-top:18px">
      <div class="panel-head"><h2>Add my own words</h2></div>
      <div class="field"><label for="mine">One per line: <b>word | meaning | example sentence | emoji</b> (meaning, sentence and emoji are optional)</label>
        <textarea class="textarea" id="mine" rows="4" placeholder="river | a large stream of flowing water | We swam in the river. | 🏞️"></textarea></div>
      <p class="small muted" style="margin:0">Your words appear in the theme "My words".</p>
    </div>
  </div>
  <div id="related" data-tool="vocabulary"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, $$, esc, store, shuffle, toast, speak, celebrate, pick } = SK;
  const D = {
    "Fruits": [["apple", "🍎", "a round red or green fruit", "I eat an apple every day."], ["banana", "🍌", "a long yellow fruit", "The monkey has a banana."], ["mango", "🥭", "a sweet juicy summer fruit", "Mango is my favourite fruit."], ["grapes", "🍇", "small round fruits in a bunch", "Grapes grow in bunches."], ["orange", "🍊", "a round fruit with thick peel", "Orange juice is fresh and sweet."], ["watermelon", "🍉", "a big green fruit, red inside", "We share a cold watermelon."], ["pineapple", "🍍", "a spiky fruit with sweet yellow flesh", "A pineapple has a crown of leaves."], ["cherry", "🍒", "a small round red fruit with a stone", "The cherry is on top of the cake."]],
    "Animals": [["elephant", "🐘", "a very large animal with a trunk", "The elephant sprays water."], ["tiger", "🐅", "a big wild cat with stripes", "The tiger lives in the forest."], ["rabbit", "🐇", "a small animal with long ears", "The rabbit hops in the garden."], ["camel", "🐫", "an animal with humps that lives in deserts", "A camel can walk far without water."], ["peacock", "🦚", "a bird with colourful tail feathers", "The peacock dances in the rain."], ["turtle", "🐢", "a slow animal with a hard shell", "The turtle hides in its shell."], ["monkey", "🐒", "an animal that climbs trees", "The monkey swings from the branch."], ["owl", "🦉", "a bird that is awake at night", "The owl hoots at night."]],
    "Feelings": [["happy", "😊", "feeling good and glad", "I am happy on my birthday."], ["sad", "😢", "feeling unhappy", "She was sad when her toy broke."], ["angry", "😠", "feeling very cross", "Do not shout when you are angry."], ["scared", "😨", "feeling afraid", "The loud thunder made me scared."], ["surprised", "😲", "feeling something unexpected", "He was surprised by the gift."], ["sleepy", "😴", "feeling tired and ready to sleep", "The baby is sleepy."], ["proud", "🥹", "feeling pleased with what you did", "I am proud of my drawing."], ["excited", "🤩", "feeling very happy and eager", "We are excited about the trip."]],
    "Action words": [["run", "🏃", "move fast on your feet", "I run in the playground."], ["jump", "🦘", "push yourself up into the air", "Frogs jump very high."], ["swim", "🏊", "move through water", "Fish swim in the pond."], ["write", "✍️", "make letters with a pen or pencil", "I write my name."], ["read", "📖", "look at words and understand them", "We read a story together."], ["climb", "🧗", "go up using hands and feet", "Cats climb trees."], ["sing", "🎤", "make music with your voice", "Birds sing in the morning."], ["cook", "🍳", "make food ready to eat", "Mother cooks tasty rice."]],
    "Describing words": [["big", "🐳", "large in size", "A whale is very big."], ["tiny", "🐜", "very small", "The ant is tiny."], ["hot", "🔥", "having a high temperature", "The tea is hot."], ["cold", "🧊", "having a low temperature", "Ice is cold."], ["soft", "🧸", "not hard; nice to touch", "My teddy is soft."], ["bright", "🌞", "full of light", "The sun is bright."], ["tall", "🦒", "high from top to bottom", "The giraffe is tall."], ["noisy", "📢", "making a lot of sound", "The market is noisy."]],
    "Body parts": [["eye", "👁️", "the part we see with", "I close my eyes to sleep."], ["ear", "👂", "the part we hear with", "I hear music with my ears."], ["nose", "👃", "the part we smell with", "My nose smells the flowers."], ["hand", "✋", "the part at the end of the arm", "Raise your hand to answer."], ["foot", "🦶", "the part we stand on", "I kick the ball with my foot."], ["mouth", "👄", "the part we eat and speak with", "Open your mouth wide."], ["tooth", "🦷", "a hard white part in the mouth", "Brush your teeth every day."], ["brain", "🧠", "the part inside the head we think with", "The brain helps us learn."]]
  };
  const themes = () => {
    const T = Object.assign({}, D);
    const m = store.get("voc:mine", "").split("\n").map((l) => l.split("|").map((s) => s.trim())).filter((p) => p[0]).map((p) => [p[0], p[3] || "📝", p[1] || "", p[2] || ""]);
    if (m.length) T["My words"] = m; return T;
  };
  let theme = store.get("voc:theme", "Fruits"), mode = "learn";

  // Word of the day: the same word for everyone on a given date
  const all = [].concat(...Object.values(D)), day = Math.floor(Date.now() / 864e5), W = all[day % all.length];
  $("#wotd").innerHTML = `<div class="em">${W[1]}</div><div><span class="badge badge-ready" style="font-family:var(--font)">Word of the day</span><h2 style="font-size:2.2rem;margin:6px 0 2px">${W[0]}</h2><p style="margin:0">${esc(W[2])}. <i>${esc(W[3])}</i></p></div><button class="kid-btn mint" id="wotdSay">🔊 Listen</button>`;
  $("#wotdSay").onclick = () => speak(`${W[0]}. ${W[3]}`, { rate: .8 });

  function paintThemes() { const T = themes(); if (!T[theme]) theme = "Fruits"; $("#themes").innerHTML = Object.keys(T).map((k) => `<button class="chip ${k === theme ? "on" : ""}" data-t="${esc(k)}">${esc(k)}</button>`).join(""); }
  function paintLearn() {
    $("#learn").innerHTML = themes()[theme].map((w, i) => `<div class="vcard" data-i="${i}" tabindex="0" role="button" aria-label="Hear ${esc(w[0])}"><div class="em">${w[1]}</div><h3>${esc(w[0])}</h3>${w[2] ? `<p>${esc(w[2])}</p>` : ""}${w[3] ? `<p class="ex">“${esc(w[3])}”</p>` : ""}</div>`).join("");
  }
  $("#learn").onclick = (e) => { const c = e.target.closest(".vcard"); if (!c) return; const w = themes()[theme][+c.dataset.i]; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); speak(w[0] + ". " + (w[3] || ""), { rate: .8 }); };
  $("#learn").onkeydown = (e) => { if (e.key === "Enter") e.target.click(); };

  let G = { score: 0, n: 0, cur: null };
  function round() {
    const ws = themes()[theme]; if (ws.length < 4) { $("#game").innerHTML = "<p>Add at least 4 words to play.</p>"; return; }
    const ans = pick(ws), opts = shuffle([ans].concat(shuffle(ws.filter((w) => w !== ans)).slice(0, 3)));
    G.cur = ans; G.n++;
    const q = mode === "listen"
      ? `<p style="font-size:1.3rem;font-weight:700">Listen, then tap the right picture.</p><button class="kid-btn" id="hear">🔊 Hear the word</button>`
      : `<p style="font-size:1.1rem;margin-bottom:6px">Which word means…</p><p style="font-size:1.6rem;font-weight:700;margin:0">“${esc(ans[2] || ans[3])}”</p>`;
    $("#game").innerHTML = `<div class="row" style="justify-content:space-between;font-family:var(--font)"><span class="badge">${theme}</span><span class="stars-bar">⭐ ${G.score}</span></div>${q}
      <div class="opts">${opts.map((o) => `<button data-w="${esc(o[0])}">${mode === "listen" ? `<span class="em">${o[1]}</span>` : ""}${esc(o[0])}</button>`).join("")}</div><div id="fb" style="min-height:40px;margin-top:14px;font-weight:700"></div>`;
    if (mode === "listen") { $("#hear").onclick = () => speak(ans[0], { rate: .75 }); setTimeout(() => speak(ans[0], { rate: .75 }), 300); }
  }
  $("#game").addEventListener("click", (e) => {
    const b = e.target.closest(".opts button"); if (!b || b.disabled) return;
    const ok = b.dataset.w === G.cur[0];
    if (ok) { $$(".opts button").forEach((x) => (x.disabled = true)); b.classList.add("right", "pop"); G.score++; $("#fb").innerHTML = '<span style="color:var(--success)">✔ Well done!</span>'; speak("Well done! " + G.cur[0], { rate: .9 });
      if (G.score % 5 === 0) celebrate(); setTimeout(round, 1400); }
    else { b.classList.add("wrong", "shake"); b.disabled = true; $("#fb").innerHTML = '<span style="color:var(--amber)">Try again!</span>'; }
  });
  function show() { $("#learn").hidden = mode !== "learn"; $("#game").hidden = mode === "learn"; if (mode === "learn") paintLearn(); else { G = { score: 0, n: 0 }; round(); } }
  $("#themes").onclick = (e) => { const b = e.target.closest("[data-t]"); if (!b) return; theme = b.dataset.t; store.set("voc:theme", theme); paintThemes(); show(); };
  $("#mode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.m; $$("#mode button").forEach((x) => x.classList.toggle("on", x === b)); show(); };
  $("#mine").value = store.get("voc:mine", "");
  $("#mine").oninput = () => { store.set("voc:mine", $("#mine").value); paintThemes(); if (theme === "My words") show(); };
  paintThemes(); show();
})();
</script>
</body>
</html>
