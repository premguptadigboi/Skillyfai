<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Writing Practice · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .line { min-height: 72px; border: 2px dashed var(--border-strong); border-radius: 18px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; background: var(--surface-2); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; min-height: 60px; }
  .tile { font-family: var(--font-kid); font-size: 1.5rem; font-weight: 700; padding: 8px 18px; border-radius: 14px; border: 0; background: var(--coral); color: #fff; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--coral) 60%, #000); }
  .line .tile { background: var(--primary); box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 60%, #000); }
  .tile.dot { background: #444; box-shadow: 0 4px 0 #111; }
  .typebox { font-family: var(--font-kid); font-size: 1.6rem; width: 100%; padding: 12px 16px; border-radius: 16px; border: 2px solid var(--border-strong); background: #fffdf7; color: #222; }
  .checks { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-family: var(--font); }
  .checks li::before { content: "○ "; color: var(--faint); }
  .checks li.ok::before { content: "✔ "; color: var(--success); }
  .checks li.ok { color: var(--success); }
  .scene { font-size: 5rem; text-align: center; letter-spacing: 8px; }
</style>
</head>
<body data-root=".." data-page="writing">
<main>
  <div id="tool-hero" data-tool="sentence-writing"></div>
  <div class="wrap" style="margin-top:14px">
    <div class="row" style="margin-bottom:14px">
      <div class="seg" id="mode"><button data-m="build" class="on">🧱 Build &amp; write</button><button data-m="pic">🖼️ Picture sentences</button></div>
      <span class="spacer"></span>
      <div class="chips" id="levels"></div>
    </div>

    <div class="kid-card kid" id="v-build">
      <div class="row" style="justify-content:space-between;font-family:var(--font)"><span class="badge" id="pos"></span><span class="stars-bar">⭐ <span id="total">0</span></span></div>
      <h2 class="center" style="margin:10px 0 12px" id="bTitle">Put the words in order</h2>
      <div id="stage1">
        <div class="line" id="line" aria-label="Your sentence"></div>
        <div class="tiles" id="tiles"></div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="kid-btn" id="hear">🔊 Hear it</button><button class="kid-btn ghost" id="reset">↺ Start again</button><button class="kid-btn mint" id="chk">✔ Check</button></div>
      </div>
      <div id="stage2" hidden>
        <p class="center" style="font-family:var(--font)">Now write the sentence. Remember the capital letter, spaces and full stop.</p>
        <input class="typebox" id="type" autocomplete="off" spellcheck="false" aria-label="Write the sentence">
        <ul class="checks" id="checks"></ul>
        <div class="row" style="justify-content:center;margin-top:14px"><button class="kid-btn" id="hear2">🔊 Hear it</button><button class="kid-btn coral" id="next2">Next sentence ➜</button></div>
      </div>
      <p class="center" id="msg" style="min-height:30px;font-weight:700;margin:12px 0 0"></p>
    </div>

    <div class="kid-card kid" id="v-pic" hidden>
      <div class="scene" id="scene"></div>
      <p class="center" id="sceneQ" style="font-size:1.3rem;font-weight:700"></p>
      <div class="tiles" id="bank" style="margin-top:6px"></div>
      <textarea class="typebox" id="picText" rows="3" placeholder="Write one or two sentences about the picture…" style="margin-top:14px"></textarea>
      <ul class="checks" id="picChecks"></ul>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="kid-btn" id="readMine">🔊 Read my sentence</button><button class="kid-btn coral" id="nextPic">New picture ➜</button></div>
    </div>
  </div>
  <div id="related" data-tool="sentence-writing"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, $$, esc, store, speak, celebrate, shuffle, pick } = SK;
  const S = {
    "Short": ["I can run.", "The cat is big.", "We like to play.", "The sun is hot.", "I see a red bus.", "My dog can jump.", "The bird can fly.", "I have a pen."],
    "Medium": ["The boy is reading a book.", "My mother cooks tasty food.", "We go to school every day.", "The little girl has a blue kite.", "Birds build their nests in trees.", "The farmer works in the field."],
    "Long": ["The children played football in the park after school.", "My grandfather tells us a story every night.", "We must drink clean water to stay healthy.", "The tall giraffe was eating leaves from the tree."]
  };
  const PICS = [
    ["🧒⚽🌳", "What is the child doing?", ["boy", "plays", "ball", "park", "kicks"]],
    ["🐄🌾🧑‍🌾", "What do you see on the farm?", ["cow", "farmer", "field", "grass", "eats"]],
    ["🌧️☂️👧", "What is happening?", ["rain", "umbrella", "girl", "wet", "walks"]],
    ["🎂🎈🥳", "Write about the party.", ["birthday", "cake", "balloons", "happy", "friends"]],
    ["🚂🧳👨‍👩‍👧", "Where is the family going?", ["train", "family", "travel", "bags", "station"]],
    ["🐒🍌🌴", "What is the monkey doing?", ["monkey", "banana", "tree", "eats", "climbs"]],
    ["👩‍🍳🍲🔥", "What is she doing?", ["cooks", "food", "pot", "kitchen", "hot"]],
    ["🌙⭐🦉", "Write about the night.", ["moon", "stars", "owl", "dark", "sky"]]
  ];
  let level = store.get("sw:level", "Short"), order = [], i = 0, built = [], pool = [], total = store.get("sw:stars", 0), pic = null;
  const sent = () => order[i];
  const tokens = (s) => s.replace(/([.!?])$/, " $1").split(" ");

  function paintLevels() { $("#levels").innerHTML = Object.keys(S).map((k) => `<button class="chip ${k === level ? "on" : ""}" data-l="${k}">${k}</button>`).join(""); }
  function newSet() { order = shuffle(S[level]); i = 0; show(); }
  function show() {
    const tk = tokens(sent()); pool = shuffle(tk.map((t, j) => ({ t, j }))); built = [];
    if (pool.map((x) => x.t).join(" ") === tk.join(" ")) pool.reverse();
    $("#stage1").hidden = false; $("#stage2").hidden = true; $("#bTitle").textContent = "Put the words in order"; $("#msg").textContent = "";
    $("#pos").textContent = `${level} · ${i + 1} / ${order.length}`; $("#total").textContent = total; paint();
  }
  function paint() {
    $("#line").innerHTML = built.length ? built.map((x, k) => `<button class="tile ${x.t.match(/^[.!?]$/) ? "dot" : ""}" data-b="${k}">${esc(x.t)}</button>`).join("") : '<span class="muted" style="font-family:var(--font)">Tap the words below to build the sentence</span>';
    $("#tiles").innerHTML = pool.map((x, k) => `<button class="tile ${x.t.match(/^[.!?]$/) ? "dot" : ""}" data-p="${k}">${esc(x.t)}</button>`).join("");
  }
  $("#tiles").onclick = (e) => { const b = e.target.closest("[data-p]"); if (!b) return; built.push(pool.splice(+b.dataset.p, 1)[0]); paint(); };
  $("#line").onclick = (e) => { const b = e.target.closest("[data-b]"); if (!b) return; pool.push(built.splice(+b.dataset.b, 1)[0]); paint(); };
  $("#reset").onclick = show;
  const star = (n) => { total += n; store.set("sw:stars", total); $("#total").textContent = total; };
  $("#chk").onclick = () => {
    if (pool.length) { $("#msg").innerHTML = '<span style="color:var(--amber)">Use all the words first.</span>'; return; }
    const ok = built.map((x) => x.t).join(" ") === tokens(sent()).join(" ");
    if (ok) { star(2); celebrate(); speak(sent(), { rate: .85 }); $("#msg").innerHTML = '<span style="color:var(--success)">✔ Well done! Now write it.</span>';
      setTimeout(() => { $("#stage1").hidden = true; $("#stage2").hidden = false; $("#bTitle").textContent = sent(); $("#type").value = ""; $("#msg").textContent = ""; checkType(); $("#type").focus(); }, 1300); }
    else { $("#line").classList.add("shake"); setTimeout(() => $("#line").classList.remove("shake"), 400); $("#msg").innerHTML = '<span style="color:var(--amber)">Not quite. Listen and try again.</span>'; }
  };
  $("#hear").onclick = $("#hear2").onclick = () => speak(sent(), { rate: .8 });
  function checkType() {
    const v = $("#type").value, s = sent();
    const items = [
      ["Starts with a capital letter", /^[A-Z]/.test(v.trim())],
      ["Ends with a full stop", /[.!?]$/.test(v.trim())],
      ["One space between words", v.trim().length > 0 && !/\s{2,}/.test(v.trim())],
      ["All words spelled correctly", v.trim().replace(/\s+/g, " ") === s]
    ];
    $("#checks").innerHTML = items.map(([t, ok]) => `<li class="${ok ? "ok" : ""}">${t}</li>`).join("");
    if (items.every((x) => x[1]) && !$("#type").dataset.done) { $("#type").dataset.done = 1; star(3); celebrate(); speak("Excellent writing!"); }
  }
  $("#type").oninput = () => { delete $("#type").dataset.done; checkType(); };
  $("#next2").onclick = () => { i = (i + 1) % order.length; if (!i) order = shuffle(order); show(); };
  $("#levels").onclick = (e) => { const b = e.target.closest("[data-l]"); if (!b) return; level = b.dataset.l; store.set("sw:level", level); paintLevels(); newSet(); };

  /* picture sentences */
  function newPic() { let p; do { p = pick(PICS); } while (p === pic && PICS.length > 1); pic = p; $("#scene").textContent = p[0]; $("#sceneQ").textContent = p[1];
    $("#bank").innerHTML = p[2].map((w) => `<button class="tile" data-w="${w}">${w}</button>`).join(""); $("#picText").value = ""; picCheck(); }
  $("#bank").onclick = (e) => { const b = e.target.closest("[data-w]"); if (!b) return; const t = $("#picText"); t.value = (t.value.replace(/\s+$/, "") + " " + b.dataset.w).trimStart(); t.focus(); picCheck(); };
  function picCheck() {
    const v = $("#picText").value.trim(), words = v.split(/\s+/).filter(Boolean);
    const items = [["Starts with a capital letter", /^[A-Z]/.test(v)], ["Ends with a full stop", /[.!?]$/.test(v)], ["At least 4 words", words.length >= 4], ["Uses a word from the word bank", pic && pic[2].some((w) => v.toLowerCase().includes(w))]];
    $("#picChecks").innerHTML = items.map(([t, ok]) => `<li class="${ok ? "ok" : ""}">${t}</li>`).join("");
  }
  $("#picText").oninput = picCheck;
  $("#readMine").onclick = () => speak($("#picText").value || "Write a sentence first.", { rate: .85 });
  $("#nextPic").onclick = newPic;
  $("#mode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $$("#mode button").forEach((x) => x.classList.toggle("on", x === b));
    $("#v-build").hidden = b.dataset.m !== "build"; $("#v-pic").hidden = b.dataset.m !== "pic"; $("#levels").hidden = b.dataset.m !== "build"; if (b.dataset.m === "pic" && !pic) newPic(); };
  paintLevels(); newSet();
})();
</script>
</body>
</html>
