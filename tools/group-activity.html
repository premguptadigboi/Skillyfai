<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Activity Creator · Skillyfai</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .groups { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .grp { border-radius: 16px; padding: 16px; border: 1px solid var(--border); background: var(--surface); border-top: 6px solid var(--c); }
  .grp h3 { margin: 0 0 10px; font-size: 1.05rem; display: flex; justify-content: space-between; }
  .grp ul { list-style: none; margin: 0; padding: 0; }
  .grp li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; }
  .grp li:last-child { border: 0; }
  .grp .role { font-size: .74rem; font-weight: 700; color: var(--muted); background: var(--bg-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .task { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: .86rem; }
  .fs-target:fullscreen .groups { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); font-size: 1.2rem; }
</style>
</head>
<body data-root=".." data-page="toolkit">
<main>
  <div id="tool-hero" data-tool="group-activity"></div>
  <div class="wrap split">
    <div class="sticky no-print">
      <div class="panel">
        <div class="panel-head"><h2>Class list</h2><button class="btn btn-soft btn-sm" id="sample">Sample names</button></div>
        <div class="field">
          <label for="names">Student names (one per line)</label>
          <textarea class="textarea" id="names" rows="8" placeholder="Aarav&#10;Diya&#10;Kabir&#10;…"></textarea>
          <span class="hint"><span id="nCount">0</span> students · put <b>#</b> before a name to mark absent</span>
        </div>
        <div class="grid-2">
          <div class="field"><label for="mode">Make</label>
            <select class="select" id="mode"><option value="groups">Number of groups</option><option value="size">Students per group</option></select></div>
          <div class="field"><label for="num">How many</label><input class="input" type="number" id="num" min="1" max="50" value="4"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="theme">Group names</label>
            <select class="select" id="theme"><option>Colours</option><option>Animals</option><option>Planets</option><option>Rivers</option><option>Numbers</option></select></div>
          <div class="field"><label for="task">Group task (optional)</label><input class="input" id="task" placeholder="e.g. Make a poster"></div>
        </div>
        <label class="check" style="margin-bottom:8px"><input type="checkbox" id="useRoles" checked> <span>Assign roles</span></label>
        <div class="field"><input class="input" id="roles" value="Leader, Recorder, Timekeeper, Presenter, Materials"><span class="hint">Roles, separated by commas</span></div>
        <button class="btn btn-primary btn-lg" id="make" style="width:100%">Make groups</button>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Saved classes</h2></div>
        <div class="row"><input class="input" id="className" placeholder="Class name, e.g. 5A" style="flex:1"><button class="btn btn-ghost btn-sm" id="saveClass">Save list</button></div>
        <ul class="saved" id="classes" style="margin-top:8px"></ul>
      </div>
    </div>
    <div class="panel fs-target" id="out">
      <div class="panel-head no-print"><h2>Groups</h2>
        <div class="toolbar"><button class="btn btn-ghost btn-sm" id="again">↻ Reshuffle</button><button class="btn btn-ghost btn-sm" id="copy">Copy</button>
        <button class="btn btn-ghost btn-sm" id="fs">Full screen</button><button class="btn btn-ghost btn-sm" id="print">Print</button></div></div>
      <div id="groups"><div class="empty"><div class="e-icon">👥</div><p>Add names and press <b>Make groups</b>.</p></div></div>
    </div>
  </div>
  <div id="related" data-tool="group-activity"></div>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function () {
  const { $, esc, store, shuffle, toast, copyText, printEl, toggleFullscreen } = SK;
  const THEMES = {
    Colours: [["Red", "#e5484d"], ["Blue", "#3e7bfa"], ["Green", "#2aa876"], ["Yellow", "#e2a400"], ["Purple", "#8e4ec6"], ["Orange", "#f76b15"], ["Pink", "#d6409f"], ["Teal", "#12a594"], ["Brown", "#a0522d"], ["Grey", "#6f6e77"]],
    Animals: ["Tigers", "Elephants", "Peacocks", "Dolphins", "Rhinos", "Eagles", "Pandas", "Lions", "Owls", "Deer"],
    Planets: ["Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Moon", "Sun"],
    Rivers: ["Ganga", "Brahmaputra", "Yamuna", "Godavari", "Krishna", "Kaveri", "Narmada", "Mahanadi", "Teesta", "Indus"],
    Numbers: []
  };
  const PAL = THEMES.Colours.map((c) => c[1]);
  const SAMPLE = "Aarav\nDiya\nKabir\nAnanya\nIshaan\nMeera\nRohan\nSara\nVihaan\nZoya\nArjun\nKavya\nNikhil\nPriya\nRahul\nTara\nDev\nNisha\nOm\nRiya";
  const draft = store.get("groups:draft", {});
  $("#names").value = draft.names || "";
  ["mode", "num", "theme", "task", "roles"].forEach((k) => { if (draft[k] != null) $("#" + k).value = draft[k]; });
  let last = null;

  const names = () => $("#names").value.split(/\n+/).map((s) => s.trim()).filter((s) => s && !s.startsWith("#"));
  const count = () => { $("#nCount").textContent = names().length; };
  const saveDraft = () => store.set("groups:draft", { names: $("#names").value, mode: $("#mode").value, num: $("#num").value, theme: $("#theme").value, task: $("#task").value, roles: $("#roles").value });
  document.addEventListener("input", () => { count(); saveDraft(); });
  count();

  function make() {
    const list = shuffle(names());
    if (list.length < 2) { toast("Add at least 2 names"); return; }
    const n = Math.max(1, +$("#num").value || 1);
    const g = Math.min(list.length, $("#mode").value === "groups" ? n : Math.ceil(list.length / n));
    const groups = Array.from({ length: g }, () => []);
    list.forEach((s, i) => groups[i % g].push(s));
    const roles = $("#useRoles").checked ? $("#roles").value.split(",").map((r) => r.trim()).filter(Boolean) : [];
    const th = $("#theme").value, task = $("#task").value.trim();
    last = groups.map((m, i) => {
      const t = THEMES[th][i % (THEMES[th].length || 1)];
      const name = th === "Numbers" ? "Group " + (i + 1) : Array.isArray(t) ? t[0] : t;
      return { name, color: Array.isArray(t) ? t[1] : PAL[i % PAL.length], members: m.map((s, j) => ({ s, r: roles[j] || "" })) };
    });
    $("#groups").innerHTML = `<div class="groups">${last.map((G) => `<div class="grp" style="--c:${G.color}"><h3>${esc(G.name)}<span class="badge">${G.members.length}</span></h3>
      <ul>${G.members.map((m) => `<li><span>${esc(m.s)}</span>${m.r ? `<span class="role">${esc(m.r)}</span>` : ""}</li>`).join("")}</ul>
      ${task ? `<div class="task"><b>Task:</b> ${esc(task)}</div>` : ""}</div>`).join("")}</div>`;
  }
  $("#make").onclick = make; $("#again").onclick = () => (last ? make() : toast("Make groups first"));
  $("#sample").onclick = () => { $("#names").value = SAMPLE; count(); saveDraft(); };
  $("#copy").onclick = () => last ? copyText(last.map((G) => G.name + ": " + G.members.map((m) => m.s + (m.r ? " (" + m.r + ")" : "")).join(", ")).join("\n")) : toast("Make groups first");
  $("#print").onclick = () => printEl($("#out"));
  $("#fs").onclick = () => toggleFullscreen($("#out"));

  function paintClasses() {
    const cl = store.get("classes", []);
    $("#classes").innerHTML = cl.length ? cl.map((c, i) => `<li><span class="s-name">${esc(c.name)}</span><small class="muted">${c.names.split("\n").filter(Boolean).length}</small><button data-l="${i}">Load</button><button data-d="${i}" aria-label="Delete">✕</button></li>`).join("")
      : '<li class="muted">Save a class list to reuse it next time.</li>';
  }
  $("#saveClass").onclick = () => {
    const name = $("#className").value.trim() || "Class " + new Date().toLocaleDateString();
    if (!names().length) { toast("Add names first"); return; }
    const cl = store.get("classes", []).filter((c) => c.name !== name);
    cl.unshift({ name, names: $("#names").value }); store.set("classes", cl); paintClasses(); toast("Saved " + name);
  };
  $("#classes").onclick = (e) => {
    const cl = store.get("classes", []), l = e.target.dataset.l, d = e.target.dataset.d;
    if (l != null) { $("#names").value = cl[l].names; $("#className").value = cl[l].name; count(); saveDraft(); toast("Loaded " + cl[l].name); }
    if (d != null && confirm("Delete " + cl[d].name + "?")) { cl.splice(d, 1); store.set("classes", cl); paintClasses(); }
  };
  paintClasses();
})();
</script>
</body>
</html>
